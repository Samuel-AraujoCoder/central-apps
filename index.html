<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Aplicativos</title>
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-light: #EFF6FF;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
      --text: #1E293B;
      --text-muted: #64748B;
      --bg-start: #E0F2FE;
      --bg-end: #F0F9FF;
      --card: rgba(255, 255, 255, 0.95);
      --border: rgba(255, 255, 255, 0.6);
      --shadow: 0 4px 24px rgba(30, 58, 138, 0.08);
      --shadow-hover: 0 12px 40px rgba(30, 58, 138, 0.15);
    }

    body.dark {
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --bg-start: #0F172A;
      --bg-end: #1E293B;
      --card: rgba(30, 41, 59, 0.95);
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      color: var(--text);
      min-height: 100vh;
      transition: .3s;
    }

    /* LOGIN */
    .login-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      z-index: 9999;
    }

    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-hover);
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .login-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 24px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .login-box h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-box p {
      color: var(--text-muted);
      font-size: .9rem;
      margin-bottom: 32px;
    }

    .login-input {
      width: 100%;
      padding: 14px 16px;
      font-size: .95rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-end);
      color: var(--text);
      margin-bottom: 14px;
      outline: none;
      transition: .2s;
    }

    .login-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .senha-wrapper { position: relative; }

    .toggle-senha {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      margin-top: -7px;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .85rem;
      color: var(--text-muted);
      margin: 8px 0 24px;
    }

    .login-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .btn {
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 500;
      transition: .2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      width: 100%;
      padding: 14px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-outline {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger) 0%, #DC2626 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25);
    }

    .error {
      color: var(--danger);
      font-size: .85rem;
      margin-top: 16px;
      display: none;
      padding: 10px;
      background: rgba(239, 68, 68, 0.08);
      border-radius: 8px;
    }

    /* PORTAL */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    .topbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px 24px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.22);
    }

    .brand-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand-info p {
      font-size: .8rem;
      color: var(--text-muted);
    }

    .top-actions { display: flex; gap: 10px; }

    .welcome-card {
      background: linear-gradient(135deg, var(--primary) 0%, #3B82F6 100%);
      color: #fff;
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 28px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
    }

    .welcome-card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .welcome-card p {
      opacity: .9;
      font-size: .95rem;
    }

    .toolbar {
      display: flex;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px 14px 46px;
      font-size: .95rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
      transition: .2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1), var(--shadow);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .6;
    }

    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .chip {
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: .85rem;
      font-weight: 500;
      box-shadow: var(--shadow);
      transition: .2s;
    }

    .chip:hover {
      transform: translateY(-1px);
      color: var(--primary);
    }

    .chip.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
      transition: .25s;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--card-accent, var(--primary));
      opacity: 0;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,.1);
    }

    .arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      opacity: 0;
      transform: translateX(-8px);
      transition: .2s;
    }

    .card:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .card h3 { font-size: 1.1rem; font-weight: 600; }

    .card p {
      color: var(--text-muted);
      font-size: .88rem;
      line-height: 1.5;
      flex: 1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      font-size: .72rem;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 500;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 60px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      font-size: .95rem;
    }

    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .login-box { padding: 36px 24px; }
      .container { padding: 20px 16px; }
      .welcome-card { padding: 22px; }
      .topbar { padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <!-- TELA DE LOGIN -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-logo">🚀</div>
      <h2>Acesso restrito</h2>
      <p>Centralize todos os seus aplicativos em um só lugar</p>
      <input type="text" class="login-input" id="login" placeholder="Usuário (ex: legal)" />
      <div class="senha-wrapper">
        <input type="password" class="login-input" id="senha" placeholder="Senha" style="margin-bottom:0;" />
        <button type="button" class="toggle-senha" id="toggleSenha">👁️</button>
      </div>
      <div class="login-options">
        <label><input type="checkbox" id="lembrar" /> Manter conectado</label>
      </div>
      <button class="btn btn-primary" id="btnEntrar">Entrar</button>
      <div class="error" id="erro">Usuário ou senha incorretos.</div>
    </div>
  </div>

  <!-- PORTAL -->
  <div class="container hidden" id="portal">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">🚀</div>
        <div class="brand-info">
          <h1>Central de Aplicativos</h1>
          <p id="bemVindo">Departamento —</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-outline" id="btnTheme">🌙</button>
        <button class="btn btn-danger" id="btnSair">Sair</button>
      </div>
    </div>

    <div class="welcome-card">
      <h2 id="saudacao">Bem-vindo de volta</h2>
      <p>Acesse abaixo as ferramentas disponíveis para o seu departamento.</p>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input id="search" placeholder="Buscar aplicativo..." />
      </div>
    </div>

    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      Nenhum aplicativo encontrado.
    </div>
  </div>

  <script>
    /***************************************
     * 👥 USUÁRIOS / DEPARTAMENTOS
     ***************************************/
    const USUARIOS = [
      {
        login: "legal",
        senhaHash: "a554c344d92205ed1368c15b84e4f46724cddcbf4456cf0ab7a39dcc94a173dd",
        departamento: "Legal"
      },
      {
        login: "fiscal",
        senhaHash: "d173bd39760c1e3d1ca50ba3fe3c9443c4ad47351e1d8ea4550c0f0c21cbd4e0",
        departamento: "Fiscal"
      },
      {
        login: "pessoal",
        senhaHash: "66f8617432a2a1ea5be2b07631145ea06b25257ddb0ce9db128e31f366ec4cd9",
        departamento: "Pessoal"
      },
      {
        login: "financeiro",
        senhaHash: "bdca43b98135a10c8da4b9e037301b22c63cab5b88d5bf611b88bca39c29bb0f",
        departamento: "Financeiro"
      },
      {
        login: "adm",
        senhaHash: "376110caa66edf9fa4279955a0eed251f9ca6c40d9a4b909c89f2911af0fd5a1",
        departamento: "Todos"
      }
    ];

    /***************************************
     * 📱 APLICATIVOS
     * depts = lista de departamentos com acesso
     ***************************************/
    const APPS = [
      {
        nome: "Painel de propostas",
        url: "https://script.google.com/macros/s/AKfycbzjENLDvuU9sg4w_dEitwnon0fVOpIvh6nmTbnX7OaqdwqB9pLXgM08rnExbkGrJsnG4w/exec",
        descricao: "Gera propostas automaticamente e relatórios de negociação.",
        depts: ["Financeiro", "Legal"],
        icone: "📈",
        cor: "#2563EB"
      },
       {
        nome: "Parcelamentos",
        url: "https://script.google.com/macros/s/AKfycbxYLSyXaIgP0GLr0uNQaR-u74olbHnIet2Lhw65zT1iX90VjjbOP5xkU_1onkQANGqqLQ/exec",
        descricao: "Gera propostas automaticamente e relatórios de negociação.",
        depts: ["Legal", "Adm"],
        icone: "🗓️",
        cor: "#2563EB"
      },
      {
        nome: "Docvia - Protocolos",
        url: "https://script.google.com/macros/s/AKfycbwqtTjOr2F7xwkyHEFqobNiH5z9CAVWDEnpegxzjiRMV-1iUJS-_kAkfvHDtZW8eukcIA/exec",
        descricao: "Gerador de protocolos de entrega e acompanhamento.",
        depts: ["Todos"],
        icone: "📨",
        cor: "#10B981"
      }
    ];

    /***************************************
     * LOGIN
     ***************************************/
    let usuarioAtual = null;

    async function hash(texto) {
      const encoder = new TextEncoder();
      const data = encoder.encode(texto);
      const buf = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verificarSenha() {
      const login = document.getElementById('login').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      const hashDigitado = await hash(senha);
      const erro = document.getElementById('erro');

      const usuario = USUARIOS.find(u => u.login === login && u.senhaHash === hashDigitado);

      if (usuario) {
        usuarioAtual = usuario;
        if (document.getElementById('lembrar').checked) {
          localStorage.setItem('centralAppsLogin', JSON.stringify({ login: usuario.login }));
        } else {
          sessionStorage.setItem('centralAppsLogin', JSON.stringify({ login: usuario.login }));
        }
        mostrarPortal();
      } else {
        erro.style.display = 'block';
        document.getElementById('senha').value = '';
      }
    }

    function saudacao() {
      const hora = new Date().getHours();
      if (hora < 12) return "Bom dia";
      if (hora < 18) return "Boa tarde";
      return "Boa noite";
    }

    function mostrarPortal() {
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('portal').classList.remove('hidden');
      document.getElementById('bemVindo').textContent =
        `Departamento ${usuarioAtual.departamento}`;
      document.getElementById('saudacao').textContent =
        `${saudacao()}, ${usuarioAtual.departamento === 'Todos' ? 'Administrador' : usuarioAtual.departamento}`;
      montarChips();
      renderizar();
    }

    function sair() {
      localStorage.removeItem('centralAppsLogin');
      sessionStorage.removeItem('centralAppsLogin');
      usuarioAtual = null;
      location.reload();
    }

    function recuperarLogin() {
      const salvo = JSON.parse(
        localStorage.getItem('centralAppsLogin') || sessionStorage.getItem('centralAppsLogin') || 'null'
      );
      if (salvo) {
        const usuario = USUARIOS.find(u => u.login === salvo.login);
        if (usuario) {
          usuarioAtual = usuario;
          mostrarPortal();
        }
      }
    }

    document.getElementById('btnEntrar').addEventListener('click', verificarSenha);
    document.getElementById('senha').addEventListener('keypress', e => {
      if (e.key === 'Enter') verificarSenha();
    });
    document.getElementById('btnSair').addEventListener('click', sair);
    document.getElementById('toggleSenha').addEventListener('click', () => {
      const input = document.getElementById('senha');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    recuperarLogin();

    /***************************************
     * PORTAL
     ***************************************/
    let categoriaAtiva = 'Todas';

    function appsVisiveis() {
      return APPS.filter(a => {
        if (usuarioAtual.departamento === 'Todos') return true;
        if (a.depts.includes('Todos')) return true;
        return a.depts.includes(usuarioAtual.departamento);
      });
    }

    function montarChips() {
      const apps = appsVisiveis();
      const depts = new Set();
      apps.forEach(a => a.depts.forEach(d => {
        if (d !== 'Todos') depts.add(d);
      }));
      const categorias = ['Todas', ...depts];
      const chips = document.getElementById('chips');
      chips.innerHTML = categorias.map(c =>
        `<button class="chip ${c === categoriaAtiva ? 'active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');

      chips.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          categoriaAtiva = chip.dataset.cat;
          montarChips();
          renderizar();
        });
      });
    }

    function renderizar() {
      const apps = appsVisiveis();
      const termo = document.getElementById('search').value.toLowerCase();
      const filtrados = apps.filter(a => {
        const okCat = categoriaAtiva === 'Todas' ||
          a.depts.includes(categoriaAtiva) ||
          a.depts.includes('Todos');
        const okTermo = !termo ||
          a.nome.toLowerCase().includes(termo) ||
          a.descricao.toLowerCase().includes(termo);
        return okCat && okTermo;
      });

      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');

      if (filtrados.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = filtrados.map(a => `
        <a class="card" href="${a.url}" target="_blank" rel="noopener" style="--card-accent:${a.cor}">
          <div class="card-header">
            <div class="icon" style="background:${a.cor}">${a.icone}</div>
            <span class="arrow">→</span>
          </div>
          <h3>${a.nome}</h3>
          <p>${a.descricao || 'Sem descrição'}</p>
          <div class="tags">
            ${a.depts.includes('Todos')
              ? '<span class="tag">Todos os departamentos</span>'
              : a.depts.map(d => `<span class="tag">${d}</span>`).join('')
            }
          </div>
        </a>
      `).join('');
    }

    document.getElementById('search').addEventListener('input', renderizar);

    document.getElementById('btnTheme').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      document.getElementById('btnTheme').textContent =
        document.body.classList.contains('dark') ? '☀️' : '🌙';
    });
  </script>
</body>
</html>
