<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Aplicativos</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4285F4;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px 60px;
      transition: .3s;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.6rem; }
    .sub { color: var(--muted); font-size: .95rem; margin-top: 4px; }
    .search {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      margin-bottom: 16px;
      outline: none;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: .85rem;
    }
    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }
    .icon {
      width: 48px; height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
    }
    .card h3 { font-size: 1.05rem; }
    .card p { color: var(--muted); font-size: .85rem; flex: 1; }
    .tag {
      align-self: flex-start;
      font-size: .72rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(66,133,244,.12);
      color: var(--primary);
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🚀 Central de Aplicativos</h1>
        <div class="sub">Todos os seus projetos em um só lugar</div>
      </div>
      <button class="btn" id="btnTheme">🌙</button>
    </header>

    <input class="search" id="search" placeholder="🔍 Buscar aplicativo..." />

    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">Nenhum aplicativo encontrado.</div>
  </div>

  <script>
    /***************************************
     * EDITE AQUI SEUS APLICATIVOS
     ***************************************/
    const APPS = [
      {
        nome: "Painel de propostas",
        url: "https://script.google.com/macros/s/AKfycbzjENLDvuU9sg4w_dEitwnon0fVOpIvh6nmTbnX7OaqdwqB9pLXgM08rnExbkGrJsnG4w/exec",
        descricao: "Gera propostas automaticamente e relatorios",
        categoria: "Financeiro",
        icone: "📈",
        cor: "#4285F4"
      },
      {
        nome: "Docvia - Protocolos",
        url: "https://script.google.com/macros/s/AKfycbwqtTjOr2F7xwkyHEFqobNiH5z9CAVWDEnpegxzjiRMV-1iUJS-_kAkfvHDtZW8eukcIA/exec",
        descricao: "Gerador de protocolos de entrega",
        categoria: "Geral",
        icone: "📨",
        cor: "#34A853"
      }
    ];

    let categoriaAtiva = 'Todas';

    function montarChips() {
      const categorias = ['Todas', ...new Set(APPS.map(a => a.categoria))];
      const chips = document.getElementById('chips');
      chips.innerHTML = categorias.map(c =>
        `<button class="chip ${c === categoriaAtiva ? 'active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');

      chips.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          categoriaAtiva = chip.dataset.cat;
          montarChips();
          renderizar();
        });
      });
    }

    function renderizar() {
      const termo = document.getElementById('search').value.toLowerCase();
      const filtrados = APPS.filter(a => {
        const okCat = categoriaAtiva === 'Todas' || a.categoria === categoriaAtiva;
        const okTermo = !termo ||
          a.nome.toLowerCase().includes(termo) ||
          a.descricao.toLowerCase().includes(termo);
        return okCat && okTermo;
      });

      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');

      if (filtrados.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = filtrados.map(a => `
        <a class="card" href="${a.url}" target="_blank" rel="noopener">
          <div class="icon" style="background:${a.cor}">${a.icone}</div>
          <h3>${a.nome}</h3>
          <p>${a.descricao || 'Sem descrição'}</p>
          <span class="tag">${a.categoria}</span>
        </a>
      `).join('');
    }

    document.getElementById('search').addEventListener('input', renderizar);

    document.getElementById('btnTheme').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      document.getElementById('btnTheme').textContent =
        document.body.classList.contains('dark') ? '☀️' : '🌙';
    });

    montarChips();
    renderizar();
  </script>
</body>
</html>
